name: Project 1 CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate application
    runs-on: windows-latest
    timeout-minutes: 20

    env:
      APP_ENV: test
      DEMO_MODE: "true"
      ALLOWED_FILE_EXTENSIONS: ".uff,.txt"
      APP_VERSION: "1.0.0"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Upgrade pip
        shell: pwsh
        run: |
          python -m pip install `
            --upgrade pip

      - name: Install runtime dependencies
        shell: pwsh
        run: |
          python -m pip install `
            --requirement requirements.txt

      - name: Install test dependencies
        shell: pwsh
        run: |
          python -m pip install `
            --requirement requirements-test.txt

          if (Test-Path ".\requirements-dev.txt") {
              python -m pip install `
                --requirement requirements-dev.txt
          }

      - name: Run release validation
        shell: pwsh
        run: |
          python scripts/validate_release.py

      - name: Validate browser JavaScript
        shell: pwsh
        run: |
          node --check `
            billing_finance_ops_web/app.js

      - name: Upload test diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: project1-test-diagnostics
          path: |
            .pytest_cache
            performance_results/PERFORMANCE_REPORT.md
          if-no-files-found: ignore
          retention-days: 7

  container-build:
    name: Build and test container
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build container image
        run: |
          docker build \
            --tag project1-billing-finance:${{ github.sha }} \
            .

      - name: Start container
        run: |
          docker run \
            --detach \
            --name project1-billing-finance \
            --publish 8620:8620 \
            project1-billing-finance:${{ github.sha }}

      - name: Wait for application readiness
        shell: bash
        run: |
          for attempt in $(seq 1 30); do
            if curl \
              --fail \
              --silent \
              --show-error \
              http://127.0.0.1:8620/health/ready; then
              echo
              echo "Application is ready."
              exit 0
            fi

            echo "Readiness attempt ${attempt}/30 failed."
            sleep 2
          done

          echo "Application did not become ready."
          docker logs project1-billing-finance
          exit 1

      - name: Validate production configuration
        shell: bash
        run: |
          python - <<'PY'
          import json
          import urllib.request

          with urllib.request.urlopen(
              "http://127.0.0.1:8620/api/configuration",
              timeout=5,
          ) as response:
              configuration = json.load(response)

          assert (
              configuration["app_environment"]
              == "production"
          )

          assert (
              configuration["demo_mode"]
              is False
          )

          assert (
              configuration[
                  "allowed_file_extensions"
              ]
              == [".uff"]
          )

          print(
              "Production configuration validated."
          )
          PY

      - name: Confirm demo endpoint is blocked
        shell: bash
        run: |
          status_code=$(
            curl \
              --silent \
              --output /tmp/demo-response.json \
              --write-out "%{http_code}" \
              --request POST \
              http://127.0.0.1:8620/api/demo-run
          )

          cat /tmp/demo-response.json
          echo

          if [ "${status_code}" != "403" ]; then
            echo "Expected HTTP 403, received ${status_code}."
            exit 1
          fi

      - name: Show container logs
        if: always()
        run: |
          docker logs project1-billing-finance

      - name: Stop container
        if: always()
        run: |
          docker rm \
            --force \
            project1-billing-finance \
            2>/dev/null || true